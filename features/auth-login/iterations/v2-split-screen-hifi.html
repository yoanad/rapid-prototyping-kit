<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f9fafb;
    --surface-alt: #f3f4f6;
    --text: #111827;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-contrast: #ffffff;
    --focus-ring: #4f46e5;
    --danger: #dc2626;

    --sp-1: 0.25rem;
    --sp-2: 0.5rem;
    --sp-3: 0.75rem;
    --sp-4: 1rem;
    --sp-5: 1.5rem;
    --sp-6: 2.5rem;

    --radius-sm: 0.25rem;
    --radius-md: 0.5rem;
    --radius-full: 9999px;

    --fs-xs: 0.75rem;
    --fs-sm: 0.875rem;
    --fs-base: 1rem;
    --fs-lg: 1.125rem;
    --fs-xl: 1.5rem;
    --fs-3xl: 2rem;

    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: var(--fs-base);
    line-height: 1.5;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(420px, 1fr) 1fr;
    min-height: 100vh;
  }

  /* ---------- LEFT: form ---------- */

  .form-side {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-6);
    background: var(--bg);
  }

  .form-card {
    width: 100%;
    max-width: 400px;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    background: var(--accent);
    margin-bottom: var(--sp-5);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
  }

  .brand-mark svg {
    width: 18px;
    height: 18px;
  }

  h1 {
    font-size: var(--fs-xl);
    font-weight: 600;
    margin: 0 0 var(--sp-1) 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: var(--fs-sm);
    color: var(--text-muted);
    margin: 0 0 var(--sp-6) 0;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: var(--sp-4);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }

  .field-row-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  label {
    font-size: var(--fs-sm);
    font-weight: 500;
    color: var(--text);
  }

  .forgot-link {
    font-size: var(--fs-sm);
    color: var(--accent);
    text-decoration: none;
  }

  .forgot-link:hover {
    text-decoration: underline;
    color: var(--accent-hover);
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: var(--sp-3) var(--sp-4);
    font-size: var(--fs-base);
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="email"]::placeholder,
  input[type="password"]::placeholder {
    color: var(--text-muted);
  }

  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px rgb(79 70 229 / 0.15);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    width: 100%;
    padding: var(--sp-3) var(--sp-4);
    font-size: var(--fs-base);
    font-family: inherit;
    font-weight: 600;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-contrast);
    box-shadow: var(--shadow-sm);
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }

  .btn-primary:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgb(79 70 229 / 0.3);
  }

  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border-color: var(--border);
  }

  .btn-secondary:hover {
    background: var(--surface);
    border-color: #d1d5db;
  }

  .btn-secondary:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgb(79 70 229 / 0.15);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    margin: var(--sp-1) 0;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .divider span {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .passkey-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    font-size: var(--fs-sm);
    color: var(--text);
  }

  .icon-inline {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .signup-row {
    margin-top: var(--sp-5);
    text-align: center;
    font-size: var(--fs-sm);
    color: var(--text-muted);
  }

  .signup-row a {
    color: var(--accent);
    font-weight: 500;
    text-decoration: none;
  }

  .signup-row a:hover {
    text-decoration: underline;
    color: var(--accent-hover);
  }

  .fine-print {
    margin-top: var(--sp-6);
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-align: center;
  }

  /* ---------- RIGHT: glass panel ---------- */

  .glass-side {
    position: relative;
    overflow: hidden;
    background: #0e1030;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .blob-field {
    position: absolute;
    inset: 0;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(4px);
  }

  .blob-1 {
    width: 520px;
    height: 520px;
    top: -120px;
    left: -100px;
    background: radial-gradient(circle at 30% 30%, rgb(129 140 248 / 0.9), rgb(79 70 229 / 0.4) 60%, transparent 80%);
  }

  .blob-2 {
    width: 460px;
    height: 460px;
    bottom: -140px;
    right: -80px;
    background: radial-gradient(circle at 60% 60%, rgb(99 102 241 / 0.85), rgb(67 56 202 / 0.3) 65%, transparent 82%);
  }

  .blob-3 {
    width: 340px;
    height: 340px;
    top: 40%;
    left: 20%;
    background: radial-gradient(circle at 50% 50%, rgb(165 180 252 / 0.7), transparent 75%);
    animation: drift 14s ease-in-out infinite;
  }

  .blob-4 {
    width: 260px;
    height: 260px;
    top: 15%;
    right: 15%;
    background: radial-gradient(circle at 50% 50%, rgb(196 181 253 / 0.55), transparent 75%);
    animation: drift 18s ease-in-out infinite reverse;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -20px) scale(1.08); }
  }

  .glass-panels {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glass-panel {
    position: absolute;
    border-radius: var(--radius-md);
    background: rgb(255 255 255 / 0.06);
    border: 1px solid rgb(255 255 255 / 0.14);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 8px 32px rgb(0 0 0 / 0.25);
  }

  .glass-panel-a {
    width: 62%;
    height: 58%;
    top: 12%;
    left: 8%;
    transform: rotate(-4deg);
  }

  .glass-panel-b {
    width: 48%;
    height: 42%;
    bottom: 10%;
    right: 6%;
    transform: rotate(3deg);
    background: rgb(255 255 255 / 0.09);
  }

  .glass-panel-c {
    width: 30%;
    height: 30%;
    top: 8%;
    right: 10%;
    transform: rotate(8deg);
    background: rgb(255 255 255 / 0.05);
  }

  .glass-frontmost {
    position: relative;
    z-index: 2;
    width: 72%;
    max-width: 460px;
    aspect-ratio: 4 / 3;
    border-radius: var(--radius-md);
    background: rgb(255 255 255 / 0.1);
    border: 1px solid rgb(255 255 255 / 0.22);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    box-shadow: 0 20px 60px rgb(0 0 0 / 0.35), inset 0 1px 0 rgb(255 255 255 / 0.25);
    padding: var(--sp-6);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: rgb(255 255 255 / 0.92);
  }

  .glass-frontmost .ghost-lines {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .ghost-line {
    height: 10px;
    border-radius: var(--radius-full);
    background: rgb(255 255 255 / 0.28);
  }

  .ghost-line.w-60 { width: 60%; }
  .ghost-line.w-40 { width: 40%; }
  .ghost-line.w-80 { width: 80%; }

  .ghost-chips {
    display: flex;
    gap: var(--sp-2);
  }

  .ghost-chip {
    width: 64px;
    height: 64px;
    border-radius: var(--radius-md);
    background: rgb(255 255 255 / 0.14);
    border: 1px solid rgb(255 255 255 / 0.2);
  }

  .noise-veil {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgb(14 16 48 / 0) 0%, rgb(14 16 48 / 0.35) 100%);
    pointer-events: none;
  }

  .glass-caption {
    position: absolute;
    bottom: var(--sp-6);
    left: var(--sp-6);
    z-index: 3;
    color: rgb(255 255 255 / 0.55);
    font-size: var(--fs-xs);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
    }
    .glass-side {
      display: none;
    }
    .form-side {
      padding: var(--sp-5);
    }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- LEFT: form -->
  <div class="form-side">
    <div class="form-card">

      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L20 6V12C20 17 16.5 20.5 12 22C7.5 20.5 4 17 4 12V6L12 2Z" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1>Sign in</h1>
      <p class="subtitle">Welcome back. Enter your details to continue.</p>

      <form>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="username" value="jordan.avery@company.com" />
        </div>

        <div class="field">
          <div class="field-row-header">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <input type="password" id="password" name="password" placeholder="••••••••••" autocomplete="current-password" value="••••••••••" />
        </div>

        <button type="submit" class="btn btn-primary">Continue</button>

        <div class="divider"><span>or</span></div>

        <button type="button" class="btn btn-secondary">Continue with SSO</button>

        <button type="button" class="btn btn-secondary passkey-row">
          <svg class="icon-inline" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="8" r="3.25" stroke="#111827" stroke-width="1.6"/>
            <path d="M12 11.5V16M9.5 14L12 16L14.5 14" stroke="#111827" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Sign in with a passkey
        </button>
      </form>

      <p class="signup-row">Don't have an account? <a href="#">Sign up</a></p>

      <p class="fine-print">Your session is encrypted end to end.</p>

    </div>
  </div>

  <!-- RIGHT: abstract glass panel -->
  <div class="glass-side" aria-hidden="true">
    <div class="blob-field">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
    </div>

    <div class="glass-panels">
      <div class="glass-panel glass-panel-a"></div>
      <div class="glass-panel glass-panel-b"></div>
      <div class="glass-panel glass-panel-c"></div>

      <div class="glass-frontmost">
        <div class="ghost-lines">
          <div class="ghost-line w-40"></div>
          <div class="ghost-line w-80"></div>
          <div class="ghost-line w-60"></div>
        </div>
        <div class="ghost-chips">
          <div class="ghost-chip"></div>
          <div class="ghost-chip"></div>
          <div class="ghost-chip"></div>
        </div>
      </div>
    </div>

    <div class="noise-veil"></div>
    <div class="glass-caption">Your workspace, ready when you are</div>
  </div>

</div>

</body>
</html>
