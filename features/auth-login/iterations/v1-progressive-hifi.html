<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f9fafb;
    --surface-alt: #f3f4f6;
    --text: #111827;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-contrast: #ffffff;
    --focus-ring: #4f46e5;
    --danger: #dc2626;

    --sp-1: 0.25rem;
    --sp-2: 0.5rem;
    --sp-3: 0.75rem;
    --sp-4: 1rem;
    --sp-5: 1.5rem;
    --sp-6: 2.5rem;

    --radius-sm: 0.25rem;
    --radius-md: 0.5rem;
    --radius-full: 9999px;

    --fs-xs: 0.75rem;
    --fs-sm: 0.875rem;
    --fs-base: 1rem;
    --fs-lg: 1.125rem;
    --fs-xl: 1.5rem;
    --fs-3xl: 2rem;

    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-5);
    background: radial-gradient(circle at 20% 15%, #eef2ff 0%, #ffffff 45%),
                radial-gradient(circle at 85% 90%, #f5f3ff 0%, #ffffff 55%),
                var(--bg);
  }

  .screen {
    width: 100%;
    max-width: 380px;
  }

  .brand-mark {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: var(--sp-5);
  }

  .brand-mark svg {
    width: 2.25rem;
    height: 2.25rem;
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-md);
    padding: var(--sp-6) var(--sp-5);
  }

  h1 {
    font-size: var(--fs-xl);
    font-weight: 600;
    margin: 0 0 var(--sp-1) 0;
    text-align: center;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: var(--fs-sm);
    color: var(--text-muted);
    text-align: center;
    margin: 0 0 var(--sp-6) 0;
  }

  .field {
    margin-bottom: var(--sp-4);
  }

  .field label {
    display: block;
    font-size: var(--fs-sm);
    font-weight: 500;
    color: var(--text);
    margin-bottom: var(--sp-2);
  }

  .field-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: var(--sp-2);
  }

  .field-row label { margin-bottom: 0; }

  .link {
    font-size: var(--fs-sm);
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  .link:hover { color: var(--accent-hover); text-decoration: underline; }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    font-size: var(--fs-base);
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--sp-3) var(--sp-4);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px rgb(79 70 229 / 0.15);
    background: var(--bg);
  }

  input::placeholder { color: #9ca3af; }

  .email-locked {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-3);
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--sp-3) var(--sp-4);
    font-size: var(--fs-base);
  }

  .email-locked span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .email-locked button {
    flex: 0 0 auto;
    background: none;
    border: none;
    color: var(--accent);
    font-size: var(--fs-sm);
    font-weight: 500;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
  }

  .email-locked button:hover { color: var(--accent-hover); text-decoration: underline; }

  .btn {
    width: 100%;
    font-family: inherit;
    font-size: var(--fs-base);
    font-weight: 600;
    border-radius: var(--radius-md);
    padding: var(--sp-3) var(--sp-4);
    cursor: pointer;
    border: 1px solid transparent;
    transition: background-color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-contrast);
    box-shadow: var(--shadow-sm);
  }

  .btn-primary:hover { background: var(--accent-hover); }

  .btn-primary:focus-visible,
  .btn-secondary:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  .btn-secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { background: var(--surface); border-color: #d1d5db; }

  .divider {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    margin: var(--sp-5) 0;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .divider span {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .stack {
    display: flex;
    flex-direction: column;
    gap: var(--sp-3);
  }

  .passkey-icon {
    width: 1.1rem;
    height: 1.1rem;
    flex: 0 0 auto;
  }

  .btn-secondary.with-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
  }

  .footer-links {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-3);
    margin-top: var(--sp-5);
    font-size: var(--fs-sm);
  }

  .footer-links .dot {
    width: 3px;
    height: 3px;
    border-radius: var(--radius-full);
    background: var(--border);
  }

  .signup-line {
    text-align: center;
    font-size: var(--fs-sm);
    color: var(--text-muted);
    margin-top: var(--sp-5);
  }

  .trust-note {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    margin-top: var(--sp-5);
    font-size: var(--fs-xs);
    color: var(--text-muted);
  }

  .trust-note svg { width: 0.9rem; height: 0.9rem; flex: 0 0 auto; }
</style>
</head>
<body>

  <div class="screen">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="22" height="22" rx="6" fill="#4f46e5"/>
        <path d="M7 12.5L10.2 15.7L17 8.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="card">
      <h1>Sign in</h1>
      <p class="subtitle">Welcome back</p>

      <form autocomplete="on">
        <!-- Step 1: email, now shown as a confirmed/locked state since this is the static end-state -->
        <div class="field">
          <div class="field-row">
            <label for="email">Email</label>
          </div>
          <div class="email-locked">
            <span>jordan.rivera@company.com</span>
            <button type="button">Edit</button>
          </div>
        </div>

        <!-- Step 2: revealed after email -->
        <div class="field">
          <div class="field-row">
            <label for="password">Password</label>
            <a href="#" class="link">Forgot password?</a>
          </div>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" value="••••••••••">
        </div>

        <div class="field" style="margin-bottom: 0;">
          <button type="submit" class="btn btn-primary">Continue</button>
        </div>
      </form>

      <div class="divider"><span>or</span></div>

      <div class="stack">
        <button type="button" class="btn btn-secondary with-icon">
          <svg class="passkey-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="8" r="3.25" stroke="#111827" stroke-width="1.6"/>
            <path d="M8 20c0-2.5 1.8-4.5 4-4.5s4 2 4 4.5" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M15.5 13.5l3 3M17 15l1.6-1.6" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Use a passkey instead
        </button>
        <button type="button" class="btn btn-secondary">Continue with SSO</button>
      </div>
    </div>

    <p class="signup-line">
      Don't have an account? <a href="#" class="link">Sign up</a>
    </p>

    <div class="trust-note">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="5" y="10.5" width="14" height="9.5" rx="1.5" stroke="#6b7280" stroke-width="1.4"/>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="#6b7280" stroke-width="1.4"/>
      </svg>
      Your connection to this site is private
    </div>
  </div>

</body>
</html>
